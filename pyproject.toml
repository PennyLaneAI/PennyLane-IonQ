[build-system]
requires = ["setuptools>=75.8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "PennyLane-IonQ"
dynamic = ["version"]
description = "PennyLane plugin for IonQ"
readme = "README.rst"
license = "Apache-2.0"
maintainers = [
    {name = "Xanadu Inc.", email = "software@xanadu.ai"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = [
    "pennylane>=0.44",
    "numpy",
    "python-dateutil",
    "requests",
]

[dependency-groups]
docs = [
    "sphinx==9.0",
    "sphinx-automodapi==0.21",
    "sphinxcontrib-applehelp==2.0.0",
    "sphinxcontrib-devhelp==2.0.0",
    "sphinxcontrib-htmlhelp==2.0.6",
    "sphinxcontrib-jsmath==1.0.1",
    "sphinxcontrib-qthelp==2.0.0",
    "sphinxcontrib-serializinghtml==2.0.0",
    "pennylane-sphinx-theme",  # do not pin this
    "pennylane @ git+https://github.com/PennyLaneAI/pennylane.git@main",
]
ci = [
    "appdirs==1.4.4",
    "astunparse==1.6.3",
    "autograd==1.8.0",
    "autoray==0.8.4",
    "cachetools==6.2.1",
    "certifi==2025.10.5",
    "charset-normalizer==3.4.4",
    "diastatic-malt==2.15.2",
    "gast==0.6.0",
    "idna==3.11",
    "networkx==3.5",
    "numpy==2.3.4",
    "packaging==25.0",
    "python-dateutil==2.9.0.post0",
    "requests==2.32.5",
    "rustworkx==0.17.1",
    "scipy==1.16.3",
    "scipy-openblas32==0.3.30.0.6",
    "six==1.17.0",
    "termcolor==3.2.0",
    "tomlkit==0.13.3",
    "typing-extensions==4.15.0",
    "urllib3==2.5.0",
    "wheel==0.45.1",
]
base = [
    "appdirs==1.4.4",
    "astunparse==1.6.3",
    "autograd==1.8.0",
    "autoray==0.8.4",
    "cachetools==6.2.1",
    "certifi==2025.10.5",
    "charset-normalizer==3.4.4",
    "diastatic-malt==2.15.2",
    "gast==0.6.0",
    "idna==3.11",
    "networkx==3.5",
    "numpy==2.3.4",
    "packaging==25.0",
    "pennylane>=0.44.0",
    "pennylane-lightning>=0.44.0",
    "pennylane-sphinx-theme",
    "python-dateutil==2.9.0.post0",
    "requests==2.32.5",
    "rustworkx==0.17.1",
    "scipy==1.16.3",
    "scipy-openblas32==0.3.30.0.6",
    "six==1.17.0",
    "sphinx-automodapi==0.21",
    "termcolor==3.2.0",
    "tomlkit==0.13.3",
    "typing-extensions==4.15.0",
    "urllib3==2.5.0",
    "wheel==0.45.1",
]

[project.urls]
repository = "http://xanadu.ai"

[project.entry-points."pennylane.plugins"]
"ionq.simulator" = "pennylane_ionq:SimulatorDevice"
"ionq.qpu" = "pennylane_ionq:QPUDevice"

[tool.setuptools.packages.find]
include = ["pennylane_ionq*"]

[tool.setuptools.dynamic]
version = {attr = "pennylane_ionq._version.__version__"}